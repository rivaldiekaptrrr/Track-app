<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>TrackIt — Master Symbol (Infinity Ribbon T)</title>
  <defs>
    <linearGradient id="inf_left_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="inf_right_grad" x1="0%" y1="0%" x2="100%" y2="100%">
