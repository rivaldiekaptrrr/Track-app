name: Multiplatform Build (Android & iOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug --continue
        continue-on-error: true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue
        continue-on-error: true

      - name: Build Release APK & App Bundle (.aab)
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Rename Build Artifacts
        run: |
          mv app/build/outputs/apk/release/app-release.apk app-trackit-${{ github.ref_name }}.apk
          mv app/build/outputs/bundle/release/app-release.aab app-trackit-${{ github.ref_name }}.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-trackit-android-${{ github.ref_name }}
          path: |
            app-trackit-${{ github.ref_name }}.apk
            app-trackit-${{ github.ref_name }}.aab

  build-ios:
    name: Build iOS Target (macOS Runner)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify iOS Target Build
        run: ./gradlew test --continue || true

  create-release:
    name: Create Dual-Platform Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-trackit-android-${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TrackIt ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            app-trackit-${{ github.ref_name }}.apk
            app-trackit-${{ github.ref_name }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
